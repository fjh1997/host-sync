name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hostsync-desktop
      - run: strip target/release/hostsync && tar czf hostsync-linux-x64.tar.gz -C target/release hostsync
      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-linux-x64
          path: hostsync-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hostsync-desktop
      - run: Compress-Archive -Path target\release\hostsync.exe -DestinationPath hostsync-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-windows-x64
          path: hostsync-windows-x64.zip

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hostsync-desktop
      - run: strip target/release/hostsync && zip hostsync-macos.zip target/release/hostsync
      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-macos
          path: hostsync-macos.zip

  build-ios:
    name: Build iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-ios -p hostsync-core
      - uses: actions/upload-artifact@v4
        with:
          name: ios-static-lib
          path: target/aarch64-apple-ios/release/libhostsync_core.a

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HostSync ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/hostsync-linux-x64/hostsync-linux-x64.tar.gz
            artifacts/hostsync-windows-x64/hostsync-windows-x64.zip
            artifacts/hostsync-macos/hostsync-macos.zip
            artifacts/ios-static-lib/libhostsync_core.a

  update-altstore:
    name: Update AltStore Source
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Generate source.json
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > altstore/source.json << ENDJSON
          {
            "name": "HostSync",
            "identifier": "com.hostsync.altstore",
            "subtitle": "Linux Server Manager",
            "description": "Cross-platform Linux server manager with SSH config compatibility.",
            "iconURL": "https://raw.githubusercontent.com/${REPO}/main/altstore/icon.png",
            "website": "https://github.com/${REPO}",
            "tintColor": "#607D8B",
            "apps": [{
              "name": "HostSync",
              "bundleIdentifier": "com.hostsync.app",
              "developerName": "fjh1997",
              "subtitle": "Linux Server Manager",
              "localizedDescription": "Manage your Linux servers across all devices.",
              "iconURL": "https://raw.githubusercontent.com/${REPO}/main/altstore/icon.png",
              "tintColor": "#607D8B",
              "versions": [{
                "version": "${VERSION}",
                "date": "${DATE}",
                "localizedDescription": "HostSync ${TAG}",
                "downloadURL": "https://github.com/${REPO}/releases/download/${TAG}/HostSync.ipa",
                "size": 0,
                "minOSVersion": "15.0"
              }]
            }],
            "news": []
          }
          ENDJSON
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./altstore
