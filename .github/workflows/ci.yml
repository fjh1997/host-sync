name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  build-desktop:
    name: Desktop ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hostsync
            cross: false
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hostsync
            cross: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hostsync.exe
            cross: false
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: hostsync.exe
            cross: false
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: hostsync
            cross: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: hostsync
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p hostsync-desktop

      - name: Strip (Unix)
        if: runner.os != 'Windows' && !matrix.cross
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Strip (Linux cross)
        if: matrix.cross
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-android:
    name: Android (.so)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 build --release -p hostsync-core
      - name: Collect .so files
        run: |
          mkdir -p jniLibs/arm64-v8a jniLibs/armeabi-v7a jniLibs/x86_64 jniLibs/x86
          cp target/aarch64-linux-android/release/libhostsync_core.so jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libhostsync_core.so jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libhostsync_core.so jniLibs/x86_64/
          cp target/i686-linux-android/release/libhostsync_core.so jniLibs/x86/
      - uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: jniLibs/

  build-ios:
    name: iOS (.a)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build all iOS targets
        run: |
          cargo build --release --target aarch64-apple-ios -p hostsync-core
          cargo build --release --target aarch64-apple-ios-sim -p hostsync-core
          cargo build --release --target x86_64-apple-ios -p hostsync-core
      - name: Create universal sim library
        run: |
          lipo -create \
            target/aarch64-apple-ios-sim/release/libhostsync_core.a \
            target/x86_64-apple-ios/release/libhostsync_core.a \
            -output libhostsync_core-ios-sim-universal.a
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: target/aarch64-apple-ios/release/libhostsync_core.a
      - uses: actions/upload-artifact@v4
        with:
          name: ios-sim-universal
          path: libhostsync_core-ios-sim-universal.a

  pre-release:
    name: Pre-release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate tag
        id: tag
        run: echo "tag=nightly-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Package artifacts
        run: |
          cd artifacts
          for dir in hostsync-linux-* hostsync-macos-*; do
            [ -d "$dir" ] && chmod +x "$dir/hostsync" && tar czf "${dir}.tar.gz" -C "$dir" hostsync
          done
          for dir in hostsync-windows-*; do
            [ -d "$dir" ] && (cd "$dir" && zip "../${dir}.zip" hostsync.exe)
          done
          [ -d android-jniLibs ] && (cd android-jniLibs && zip -r ../android-jniLibs.zip .)
      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-release ${{ steps.tag.outputs.tag }}"
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/hostsync-linux-x64.tar.gz
            artifacts/hostsync-linux-arm64.tar.gz
            artifacts/hostsync-windows-x64.zip
            artifacts/hostsync-windows-arm64.zip
            artifacts/hostsync-macos-x64.tar.gz
            artifacts/hostsync-macos-arm64.tar.gz
            artifacts/android-jniLibs.zip
            artifacts/ios-arm64/libhostsync_core.a
