name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hostsync-desktop
      - run: strip target/release/hostsync
      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-linux-x64
          path: target/release/hostsync

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hostsync-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-windows-x64
          path: target/release/hostsync.exe

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hostsync-desktop
      - run: strip target/release/hostsync
      - uses: actions/upload-artifact@v4
        with:
          name: hostsync-macos
          path: target/release/hostsync

  build-android:
    name: Build Android (.so)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release -p hostsync-core
      - uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: target/aarch64-linux-android/release/libhostsync_core.so

  build-ios:
    name: Build iOS (.a)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-ios -p hostsync-core
      - run: cargo build --release --target aarch64-apple-ios-sim -p hostsync-core
      - uses: actions/upload-artifact@v4
        with:
          name: ios-static-lib
          path: target/aarch64-apple-ios/release/libhostsync_core.a

  pre-release:
    name: Pre-release
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate tag
        id: tag
        run: echo "tag=nightly-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-release ${{ steps.tag.outputs.tag }}"
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/hostsync-linux-x64/hostsync
            artifacts/hostsync-windows-x64/hostsync.exe
            artifacts/hostsync-macos/hostsync
