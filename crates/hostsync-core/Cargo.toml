[package]
name = "hostsync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hostsync_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["network"]
network = ["reqwest/rustls-tls", "tokio"]
